<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game on!</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="title">Rock  Paper  Sissors</div>
    <div class="title round">Round <span class="counter">1</span></div>


    <div class="score-board">
        <div class="human score">
            <div class="score-title">You</div>
            <div class="human-score-val">0</div>
        </div>

        <div class="computer score">
            <div class="score-title">Computer</div>
            <div class="computer-score-val">0</div>
        </div>
    </div>

    <div class="choices">
        <div>Choose :</div>
        <div class="rock-btn"><img src="resources/rock.png" style="width: 100px; height: auto;"></div>
        <div class="paper-btn"><img src="resources/paper.png" style="width: 100px; height: auto;"></div>
        <div class="scissors-btn"><img src="resources/scissors.png" style="width: 100px; height: auto;"></div>
    </div>

    <div class="log">
        log....
    </div>
</body>

</html>
